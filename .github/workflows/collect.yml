# Hourly line collection, off the user's PC.
# Triggered hourly at :17 UTC by Supabase pg_cron (scripts/setup_scheduler.py), which
# calls GitHub's workflow_dispatch API; GitHub's own cron never fired for this repo.
#
# With the DATABASE_URL repository secret set, offers go to Postgres (Supabase)
# after applying any pending migrations. Without it, they go to the `data`
# branch as daily CSVs (one per UTC day under offers/).
name: Collect lines

on:
  workflow_dispatch:

permissions:
  contents: write          # push to the data branch (CSV mode only)

concurrency:
  group: collect-lines     # never two collectors at once
  cancel-in-progress: false

env:
  ODDS_SOURCES: action_network
  SPORTS: nba,nfl
  STATE_CODE: NJ
  DAYS_AHEAD_NBA: "2"
  DAYS_AHEAD_NFL: "7"      # NFL props open 5-6 days before kickoff
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25     # NFL adds ~1.5 min per run (a full week of games x 11 markets)
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ---------------- Postgres mode
      - name: Install database driver
        if: env.DATABASE_URL != ''
        run: pip install -r requirements-collector.txt
      - name: Apply migrations
        if: env.DATABASE_URL != ''
        run: python scripts/migrate.py
      - name: Collect into Postgres
        if: env.DATABASE_URL != ''
        run: python scripts/collect.py

      # ---------------- CSV fallback (no DATABASE_URL secret)
      - name: Check out data branch (create it on first run)
        if: env.DATABASE_URL == ''
        run: |
          git fetch origin data --depth=1 || true
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            git worktree add store origin/data -B data
          else
            git worktree add --orphan -b data store
          fi
      - name: Collect into CSV
        if: env.DATABASE_URL == ''
        env:
          OUT_DIR: store/offers
        run: python scripts/collect.py
      - name: Save to data branch
        if: env.DATABASE_URL == ''
        working-directory: store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -q -m "Lines $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin data
          fi
