# Hourly line collection, off the user's PC.
#
# Code comes from main; collected data lives on a separate `data` branch
# (one CSV per UTC day under offers/), so main's history stays clean.
# GitHub's scheduler is "roughly on time": runs can start minutes late or be
# skipped under load, and times are UTC.
name: Collect lines

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (avoids the top-of-hour rush)
  workflow_dispatch:

permissions:
  contents: write          # push to the data branch

concurrency:
  group: collect-lines     # never two collectors at once
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check out data branch (create it on first run)
        run: |
          git fetch origin data --depth=1 || true
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            git worktree add store origin/data -B data
          else
            git worktree add --orphan -b data store
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect
        env:
          ODDS_SOURCES: action_network
          STATE_CODE: NJ
          DAYS_AHEAD: "2"
          OUT_DIR: store/offers
        run: python scripts/collect.py

      - name: Save to data branch
        working-directory: store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -q -m "Lines $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin data
          fi
